name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: open_astro_cli.exe
            asset: open_astro_cli-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bin: open_astro_cli.exe
            asset: open_astro_cli-windows-arm64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: open_astro_cli
            asset: open_astro_cli-linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        working-directory: rust/open_astro_cli
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "rust/open_astro_cli/target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Copy udev rules
        run: cp scripts/99-openastro.rules dist/99-openastro.rules
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
