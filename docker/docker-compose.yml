# Docker Compose for OpenAstro CPS Virtual Radio & Packet Capture Sandbox
#
# Provides BOTH container architectures requested:
#   1. Profile `wine`  (default): 32-bit Wine + noVNC + socat COM1 + tcpdump + virtual_radio.py
#   2. Profile `winxp`:           dockur/windows (Windows XP 32-bit VM in Docker) + virtual_radio sidecar
#   3. Service `virtual-radio`:   standalone Python RCMP + Serial PPP simulator & packet logger
#
# Usage on Fedora or Windows:
#   # Run standalone virtual radio simulator + packet capture:
#   docker compose -f docker/docker-compose.yml up virtual-radio
#
#   # Variant A: Run 32-bit Wine CPS + Virtual Radio + noVNC (http://127.0.0.1:6080/vnc.html):
#   CPS_HOST_DIR=~/re/openastro docker compose -f docker/docker-compose.yml --profile wine up --build
#
#   # Variant B: Run Windows XP 32-bit VM + Virtual Radio (http://127.0.0.1:8006):
#   CPS_HOST_DIR=~/re/openastro docker compose -f docker/docker-compose.yml --profile winxp up

services:
  virtual-radio:
    image: python:3.12-slim
    container_name: openastro-virtual-radio
    working_dir: /workspace
    # Serial PPP bridge for the winxp profile: genuine portable CPS reads a radio
    # only over a serial COM port (RAS/PPP "CLIENT" -> RCMP over TCP :8002), not
    # raw IP. socat presents a local PTY (/tmp/radiotty) and listens on :7000;
    # the WinXP guest's COM2 (a QEMU chardev socket, see cps-winxp ARGUMENTS)
    # connects out to it. The radio side must listen because dockur DNATs all
    # inbound container ports to the guest. virtual_radio --ppp-serial then
    # answers the dial via SerialPppBridge. Harmless for the wine/standalone
    # paths: the PTY just sits idle with no peer.
    command: >
      sh -c "apt-get update -qq >/dev/null 2>&1;
      apt-get install -y -qq socat >/dev/null 2>&1;
      pip install --quiet olefile pyserial;
      socat -d pty,raw,echo=0,link=/tmp/radiotty tcp-listen:7000,reuseaddr &
      for i in $$(seq 1 120); do [ -e /tmp/radiotty ] && break; sleep 1; done;
      python tools/virtual_radio.py
      ${RADIO_CODEPLUG:-backups/721CLZ0655.cpg}
      --host 0.0.0.0
      --port 8002
      --serial ${RADIO_SERIAL:-721CLZ0655}
      --flashcode ${RADIO_FLASHCODE:-400008-002000-0}
      --challenge-security
      --ppp-serial /tmp/radiotty
      --capture-jsonl captures/virtual_radio_trace.jsonl
      --capture-pcap captures/virtual_radio_trace.pcap
      --verbose"
    volumes:
      - ../:/workspace
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      radio_net:
        ipv4_address: 192.168.128.1

  cps-wine:
    profiles: ["wine"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.wine-cps
    container_name: openastro-cps-wine
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - RADIO_CODEPLUG=${RADIO_CODEPLUG:-/workspace/backups/721CLZ0655.cpg}
      - RADIO_SERIAL=${RADIO_SERIAL:-721CLZ0655}
      - RADIO_FLASHCODE=${RADIO_FLASHCODE:-400008-002000-0}
    volumes:
      - ../:/workspace
      - ${CPS_HOST_DIR:-../captures}:/cps:ro
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:8002:8002"

  cps-winxp:
    profiles: ["winxp"]
    image: dockurr/windows:latest
    container_name: openastro-cps-winxp
    environment:
      VERSION: "winxp"
      RAM_SIZE: "2G"
      CPU_CORES: "2"
      DISK_SIZE: "16G"
      # Add a second UART (guest COM2) as a QEMU chardev socket that connects OUT
      # to the virtual-radio PTY bridge at 192.168.128.1:7000. Outbound avoids
      # dockur's inbound QEMU_DNAT (which forwards container ports to the guest).
      # reconnect-ms retries until the bridge is up. In CPS, Read Device -> COM2.
      ARGUMENTS: "-chardev socket,id=ser1,host=192.168.128.1,port=7000,server=off,reconnect-ms=2000 -device isa-serial,chardev=ser1"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:3389:3389/tcp"
    volumes:
      - winxp_data:/storage
      - ${CPS_HOST_DIR:-../backups}:/shared
    depends_on:
      - virtual-radio
    networks:
      radio_net:
        ipv4_address: 192.168.128.2

networks:
  radio_net:
    driver: bridge
    ipam:
      config:
        # Pin the bridge gateway off .1 so virtual-radio can own 192.168.128.1
        # (the radio's canonical IP). Without this, Docker grabs .1 as the
        # gateway and virtual-radio fails to start: "Address already in use".
        - subnet: 192.168.128.0/24
          gateway: 192.168.128.254

volumes:
  winxp_data:
